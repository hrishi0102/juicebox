# Secrets the workflow reads with runtime.getSecret. In simulation each one comes from the env var
# listed under it (cre/.env). A GitHub token is optional: public PRs are checked without one, and
# GITHUB_TOKEN can be added here (mapped to GITHUB_TOKEN_ALL) for private repositories.
secretsNames:
  ARKIV_ACCESS_KEY:
    - ARKIV_ACCESS_KEY_ALL
